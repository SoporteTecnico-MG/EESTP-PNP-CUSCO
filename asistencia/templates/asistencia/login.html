{% extends "asistencia/base_publico.html" %}
{% block titulo %}Iniciar sesión — EESTP PNP CUSCO{% endblock %}
{% block contenido %}
<div style="max-width:380px; margin:2rem auto; background:#fff; border-radius:.6rem; padding:2rem; border-top:4px solid var(--dorado)">
    <h2 style="margin-top:0; color:var(--verde-oscuro); text-align:center">Iniciar sesión</h2>
    {% if form.errors %}
    <div style="background:#fde2e2; border:1px solid #e08a8a; color:#7a1f1f; padding:.6rem .8rem; border-radius:.35rem; margin-bottom:1rem; font-size:.85rem">
        Usuario o contraseña incorrectos.
    </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:1rem">
            <label style="display:block; font-size:.85rem; margin-bottom:.3rem; color:#4a5750">Usuario</label>
            <input type="text" name="username" required autofocus
                   style="width:100%; padding:.55rem .7rem; border:1px solid #d7d2bf; border-radius:.35rem; font-size:.95rem">
        </div>
        <div style="margin-bottom:1.25rem">
            <label style="display:block; font-size:.85rem; margin-bottom:.3rem; color:#4a5750">Contraseña</label>
            <input type="password" name="password" required
                   style="width:100%; padding:.55rem .7rem; border:1px solid #d7d2bf; border-radius:.35rem; font-size:.95rem">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" style="width:100%; background:var(--verde-oscuro); color:#fff; font-weight:700; padding:.65rem; border:none; border-radius:.35rem; font-size:.95rem; cursor:pointer">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
